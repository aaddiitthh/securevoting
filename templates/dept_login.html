{% extends 'base.html' %}

{% block title %}Department Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-form glass-card">
        <h2>Department Tutor Login</h2>
        <form method="POST" action="{{ url_for('dept_login') }}">
            <div class="form-group">
                <label for="dept_code">Department Code (e.g., it001)</label>
                <input type="text" id="dept_code" name="dept_code" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-large">Login to Portal</button>
        </form>
    </div>
</div>
{% endblock %}
