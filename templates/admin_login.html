{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-form glass-card">
        <h2>Main Admin Login</h2>
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-large">Login to Dashboard</button>
        </form>
    </div>
</div>
{% endblock %}
