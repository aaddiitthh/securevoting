{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="hero-section">
    <div class="hero-content glass-card">
        <h1>Welcome to <span class="highlight">SecureVote</span></h1>
        <p>The modern, secure, and intuitive digital voting platform for our college departments.</p>
        
        <div class="hero-actions">
            <a href="{{ url_for('vote_login') }}" class="btn btn-primary btn-large">Cast Your Vote</a>
        </div>
        
        <div class="hero-secondary-links">
            <a href="{{ url_for('dept_login') }}">Tutor / Department Login</a>
            <span class="divider">•</span>
            <a href="{{ url_for('admin_login') }}">Main Admin</a>
        </div>
    </div>
</div>
{% endblock %}
